<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

    <main class="auth-card">
        <header class="auth-header">
            <h1>Crear Cuenta</h1>
            <p>Regístrate para gestionar tus proyectos</p>
        </header>

        <form id="registerForm" class="auth-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">Nombre completo</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>

            <button type="submit" class="btn-primary">Registrarse</button>
        </form>

        <footer class="auth-footer">
            <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
        </footer>
    </main>

</body>
</html>
